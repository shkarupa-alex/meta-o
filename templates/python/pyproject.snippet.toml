# §M-QC-CONFIG — Starter configuration for the meta-o Python QC profile.
#
# Merge this into the project's pyproject.toml. Every value below is a starting
# point that the project must accept or change deliberately: a threshold nobody
# chose is a threshold nobody defends when it starts to hurt.

[tool.meta_o.code_health]
source_roots = ["src", "tests"]
max_file_lines = 600
max_class_lines = 300
max_function_lines = 60
max_cyclomatic_complexity = 10
max_nesting_depth = 4
baseline = ".quality/code-health-baseline.json"
forbid_new_baseline_entries = true
forbid_regressions = true

[tool.meta_o.purpose]
source_roots = ["src", "tests"]
# Symbols in these files are generated or vendored and are exempt. Every entry
# is a documented exception, not a convenience: list files, never whole trees.
exempt_files = []
# A decorator that makes a symbol a typing artefact rather than an
# implementation. `@overload` qualifies because the documented body carries the
# meaning. `@abstractmethod` does not, and used to be listed here: an abstract
# method is where a port's contract is stated, so it is the last place a project
# can afford to leave unexplained.
exempt_decorators = ["overload", "typing.overload"]

[tool.meta_o.import_graph]
source_roots = ["src"]
first_party_prefixes = ["myproject"]
baseline = ".quality/import-graph-baseline.json"
# Layers are listed from the outside in: a module in one layer may import from
# layers below it and never from layers above.
layers = []
# Pairs that must never import each other in either direction.
independent = []
# Explicit edges that are forbidden regardless of layering, as "from -> to".
forbidden_edges = []

[tool.meta_o.knowledge]
# The same roots the purpose gate uses. Left unset, this defaulted to `src`
# alone while purpose covered `src` and `tests`, so a test module could declare
# a §M anchor citing an architecture anchor that did not exist and pass both.
source_roots = ["src", "tests"]
business = "docs/knowledge/business.md"
glossary = "docs/knowledge/glossary.md"
architecture_dir = "docs/knowledge/architecture"

[tool.meta_o.e2e]
contract = "docs/architecture/e2e.md"
registry = "docs/architecture/e2e.json"
